[package]
name = "luma_editor"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    ".",
    "crates/luma_core",
    "crates/luma_dataflow",
    "crates/luma_domain",
    "crates/luma_commands",
    "crates/luma_canvas",
    "crates/luma_ui",
    "crates/luma_node_macro",
]
resolver = "3"

[workspace.dependencies]
inventory = "0.3"
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
luma_node_macro = { path = "crates/luma_node_macro" }
bevy = { version = "0.20.0", default-features = false, features = [
    "2d",
    "ui",
    "bevy_ui_widgets",
    "default_font",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_pbr",
    "mesh_picking",
] }
serde = { version = "1.0", features = ["derive"] }
ron = "0.8"
thiserror = "1.0"
glam = { version = "0.33", features = ["serde"] }

luma_core = { path = "crates/luma_core" }
luma_dataflow = { path = "crates/luma_dataflow" }
luma_domain = { path = "crates/luma_domain" }
luma_commands = { path = "crates/luma_commands" }
luma_canvas = { path = "crates/luma_canvas" }
luma_ui = { path = "crates/luma_ui" }
bevy_luma = { path = "../bevy_luma" }
bevy_luma_widgets = { path = "../bevy_luma_widgets" }
jackdaw_widgets = "=0.20.0-rc.1"
jackdaw_panels = "=0.20.0-rc.1"
jackdaw_feathers = "=0.20.0-rc.1"
ureq = { version = "2.10", default-features = false, features = ["tls", "gzip"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[dependencies]
bevy.workspace = true
bevy_luma.workspace = true
bevy_luma_widgets.workspace = true
serde.workspace = true
ron.workspace = true
thiserror.workspace = true
glam.workspace = true
ureq.workspace = true
image.workspace = true

luma_core.workspace = true
luma_dataflow.workspace = true
luma_domain.workspace = true
luma_commands.workspace = true
luma_canvas.workspace = true
luma_ui.workspace = true
jackdaw_panels.workspace = true
jackdaw_feathers.workspace = true
